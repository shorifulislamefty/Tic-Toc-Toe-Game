
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <script src="app.js" defer></script>
    <h1>Tic Tac Toe</h1>

    <h2>Player X's Turn</h2>

    <div class="game-board">

        <div class="cell"></div>

        <div class="cell"></div>

    </div>

    <h2 class="result"></h2>

    <button>Restart Game</button>

</body>
</html>
